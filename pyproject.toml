[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
nc-py-api = {version = ">=0.30.2", extras = ["app"]}
diffusers = "*"
transformers = "4.57.6"
accelerate = "*"
niquests = "*"
torch = "*"
# Same versions as the cuda-toolkit pins of torch, so the lock has one version each
nvidia-cublas = "13.4.1.3"
nvidia-cuda-nvrtc = "13.2.86"

[tool.black]
line-length = 120
target-version = ["py311"]
preview = true

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["A", "B", "C", "D", "E", "F", "G", "I", "S", "SIM", "PIE", "Q", "RET", "RUF", "UP" , "W"]
extend-ignore = ["D101", "D102", "D103", "D105", "D107", "D203", "D213", "D401", "I001", "RUF100", "D400", "D415"]

[tool.isort]
profile = "black"

[tool.pylint]
master.py-version = "3.11"
master.extension-pkg-allow-list = ["pydantic"]
design.max-attributes = 8
design.max-locals = 16
design.max-branches = 16
design.max-returns = 8
design.max-args = 7
basic.good-names = [
    "a", "b", "c", "d", "e", "f", "i", "j", "k", "r", "v",
    "ex", "_", "fp", "im", "nc", "ui",
]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
similarities.min-similarity-lines = 6
messages_control.disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "too-few-public-methods",
    "too-many-public-methods",
    "global-statement",
    "broad-exception-caught",
]
